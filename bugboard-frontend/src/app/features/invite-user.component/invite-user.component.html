<div
  class="offcanvas offcanvas-end border-0 shadow-lg bg-glass"
  tabindex="-1"
  id="inviteUserOffcanvas"
  aria-labelledby="inviteUserLabel"
  (hidden.bs.offcanvas)="resetPanel()"
>

  <div class="offcanvas-header pt-5 px-4 pb-0 border-0">
    <h4 class="offcanvas-title fw-bold text-dark tracking-tight" id="inviteUserLabel">
      Invite a new user
    </h4>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <div class="offcanvas-body px-4 pb-5 d-flex flex-column">
    <p class="text-muted mb-4">
      Select the role for the new workspace member and generate a unique registration link, 
     then share the link with the user. <br/>
      The link will be valid for a single use only.
    </p>

    <div class="mb-auto">
      <label for="roleSelect" class="form-label fw-medium text-dark">User Role</label>
      <select id="roleSelect" class="form-select form-select-lg" [formControl]="roleControl">
        <option [value]="ROLES.TECHNICAL">{{ ROLES.TECHNICAL }}</option>
        <option [value]="ROLES.ADMIN">{{ ROLES.ADMIN }}</option>
        <option [value]="ROLES.EXTERNAL">{{ ROLES.EXTERNAL }}</option>
      </select>
    </div>

    <div
      class="mt-5 bg-white bg-opacity-75 p-4 rounded-3 border shadow-sm d-flex flex-column gap-4"
    >
      <div>
        <button
          class="btn btn-primary btn-lg w-100 py-3 rounded-3 fw-semibold d-flex justify-content-center align-items-center"
          (click)="generateLink()"
          [disabled]="isLoading() || isCooldown() || roleControl.invalid"
        >
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            <span>Generating...</span>
          } @else if (isCooldown()) {
            <i class="bi bi-hourglass-split me-2"></i>
            <span>Wait {{ cooldownTime() }}s</span>
          } @else {
            <span>Generate Link</span>
          }
        </button>
      </div>

      @if (generatedLink()) {
        <div class="d-flex flex-column gap-3 pt-3 border-top">
          <label for="linkInput">
            Registration Link
          </label>
          <input
            #linkInput 
            id="linkInput"
            type="text"
            class="form-control form-control-lg text-center bg-white border-primary border-opacity-50 text-primary fw-medium cursor-pointer"
            readonly
            [value]="generatedLink()"
            (click)="linkInput.select()"
            (focus)="linkInput.select()"
          />

          <button
            class="btn btn-outline-primary btn-lg w-100 py-3 rounded-3 fw-semibold d-flex justify-content-center align-items-center gap-2 transition-all"
            (click)="copyToClipboard(generatedLink()!)"
          >
            <i class="bi" [class.bi-clipboard]="!isCopied()" [class.bi-check-lg]="isCopied()"></i>
            <span>{{ isCopied() ? 'Copied to clipboard!' : 'Copy Link' }}</span>
          </button>
        </div>
      }
    </div>
  </div>
</div>
