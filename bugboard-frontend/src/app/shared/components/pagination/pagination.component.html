<nav aria-label="Page navigation" class="d-flex align-items-center justify-content-end py-3">
  <!-- Pagination Controls (Right side) -->
  <ul class="pagination pagination-sm mb-0">
    <!-- Previous Button -->
    <li class="page-item" [class.disabled]="isPrevDisabled()">
      <button
        type="button"
        class="page-link d-flex align-items-center justify-content-center"
        [disabled]="isPrevDisabled()"
        (click)="onPrevious()"
        aria-label="Previous page"
        title="Previous page"
      >
        <i class="bi bi-chevron-left"></i>
      </button>
    </li>

    <!-- Page 1 Jump -->
    @if (showEllipsisBefore()) {
      <li class="page-item">
        <button type="button" class="page-link" (click)="onPageClick(0)">1</button>
      </li>
      <li class="page-item disabled">
        <span class="page-link">...</span>
      </li>
    }

    <!-- Visible Page Numbers -->
    @for (pageNum of visiblePages(); track pageNum) {
      <li class="page-item" [class.active]="pageNum === currentPage()">
        <button
          type="button"
          class="page-link"
          (click)="onPageClick(pageNum)"
          [attr.aria-label]="
            'Go to page ' +
            displayPageNumber(pageNum) +
            (pageNum === currentPage() ? ' (current page)' : '')
          "
          [attr.aria-current]="pageNum === currentPage() ? 'page' : null"
        >
          {{ displayPageNumber(pageNum) }}
        </button>
      </li>
    }

    <!-- Last Page Jump -->
    @if (showEllipsisAfter()) {
      <li class="page-item disabled">
        <span class="page-link">...</span>
      </li>
      <li class="page-item">
        <button type="button" class="page-link" (click)="onPageClick(totalPages() - 1)">
          {{ totalPages() }}
        </button>
      </li>
    }

    <!-- Next Button -->
    <li class="page-item" [class.disabled]="isNextDisabled()">
      <button
        type="button"
        class="page-link d-flex align-items-center justify-content-center"
        [disabled]="isNextDisabled()"
        (click)="onNext()"
        aria-label="Next page"
        title="Next page"
      >
        <i class="bi bi-chevron-right"></i>
      </button>
    </li>
  </ul>
</nav>
