@if (state().isOpen) {
  <div class="modal-backdrop-custom d-flex align-items-center justify-content-center">
    <div
      class="modal-card bg-white rounded-5 shadow-lg p-4 max-w-md w-100 mx-3"
      role="dialog"
      aria-modal="true"
      (click)="$event.stopPropagation()"
    >
      <!-- Icon and Title Section -->
      <div class="d-flex align-items-center gap-3 mb-3">
        <div
          class="icon-box rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
          [ngClass]="
            state().isDangerous ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'
          "
        >
          <i
            class="bi fs-4"
            [ngClass]="state().isDangerous ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill'"
          ></i>
        </div>
        <div>
          <h5 class="fw-bold mb-1 text-dark">{{ state().title }}</h5>
          <p class="text-muted small mb-0">
            {{ state().isDangerous ? 'This action cannot be undone.' : '' }}
          </p>
        </div>
      </div>

      <!-- Message Section -->
      <p class="text-secondary small mb-4">
        {{ state().message }}
      </p>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          class="btn btn-light rounded-pill px-4 fw-medium"
          (click)="confirmService.performCancel()"
        >
          {{ state().cancelButtonText }}
        </button>
        <button
          type="button"
          class="btn rounded-pill px-4 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm"
          [class.btn-danger]="state().isDangerous"
          [class.btn-primary]="!state().isDangerous"
          (click)="confirmService.confirm()"
        >
          <i class="bi" [ngClass]="state().isDangerous ? 'bi-trash-fill' : 'bi-check-lg'"></i>
          {{ state().confirmButtonText }}
        </button>
      </div>
    </div>
  </div>
}
