@if (state().isOpen) {
  <div
    class="modal d-flex align-items-center justify-content-center show"
    tabindex="-1"
    role="dialog"
    (click)="onOverlayClick()"
  >
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title">{{ state().title }}</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="confirmService.performCancel()"
          ></button>
        </div>

        <!-- Body -->
        <div class="modal-body">
          {{ state().message }}
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="confirmService.performCancel()">
            {{ state().cancelButtonText }}
          </button>
          <button
            type="button"
            class="btn"
            [class.btn-danger]="state().isDangerous"
            [class.btn-primary]="!state().isDangerous"
            (click)="confirmService.confirm()"
          >
            {{ state().confirmButtonText }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop fade show"></div>
}
