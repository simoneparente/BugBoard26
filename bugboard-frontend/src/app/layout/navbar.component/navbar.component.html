<nav class="navbar navbar-dark bg-primary px-4 py-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <!-- Brand Logo -->
    <app-brand-logo></app-brand-logo>

    <!-- Offcanvas Invite Component -->
    <app-invite-user></app-invite-user>

    <!-- Hamburger Dropdown Menu -->
    <div class="dropdown">
      <button
        class="btn text-white p-1 border-0 shadow-none d-flex align-items-center justify-content-center"
        type="button"
        id="headerMenuDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        title="Menu"
      >
        <i class="bi bi-list fs-2"></i>
      </button>

      <ul
        class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2 p-2"
        aria-labelledby="headerMenuDropdown"
      >
        @if (currentUser(); as user) {
          <li class="px-3 py-2 border-bottom">
            <div class="fw-bold text-dark small">{{ user.username }}</div>
            <div class="text-muted extra-small mb-1">{{ user.email }}</div>
            <span
              class="role-badge"
              [class.role-admin]="user.role === 'ADMIN'"
              [class.role-technical]="user.role === 'TECHNICAL'"
              [class.role-external]="user.role === 'EXTERNAL'"
            >
              <i
                class="bi"
                [class.bi-shield-lock-fill]="user.role === 'ADMIN'"
                [class.bi-code-slash]="user.role === 'TECHNICAL'"
                [class.bi-person-badge-fill]="user.role === 'EXTERNAL'"
              ></i>
              {{ user.role }}
            </span>
          </li>
        }

        <!-- Invite User (Admin Only) -->
        @if (isAdmin()) {
          <li>
            <button
              class="dropdown-item d-flex align-items-center gap-2 py-2 text-dark rounded-2"
              type="button"
              data-bs-dismiss="dropdown"
              data-bs-toggle="offcanvas"
              data-bs-target="#inviteUserOffcanvas"
            >
              <i class="bi bi-person-plus text-primary fs-5"></i>
              <span>Invite User</span>
            </button>
          </li>
          <li><hr class="dropdown-divider my-1" /></li>
        }

        <!-- Logout -->
        <li>
          <button
            class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger rounded-2"
            type="button"
            data-bs-dismiss="dropdown"
            (click)="logout()"
          >
            <i class="bi bi-box-arrow-right fs-5"></i>
            <span>Logout</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
