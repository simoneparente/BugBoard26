<div class="toast-container position-fixed top-0 end-0 p-3 d-flex flex-column gap-2">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div
      class="toast show border shadow-sm bg-white pointer-events-auto toast-{{ toast.type }}"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="toast-header d-flex align-items-center">
        <i
          class="bi fs-5 me-2 {{ uiConfig[toast.type].icon }} {{ uiConfig[toast.type].color }}"
        ></i>
        <strong
          class="me-auto text-uppercase font-label-md fw-bold tracking-wider fs-7 {{
            uiConfig[toast.type].color
          }}"
        >
          {{ toast.title }}
        </strong>
        <button
          type="button"
          class="btn-close fs-7"
          aria-label="Close"
          (click)="notificationService.remove(toast.id)"
        ></button>
      </div>
      <div class="toast-body text-secondary font-body-md fs-7">
        {{ toast.message }}
      </div>
    </div>
  }
</div>
