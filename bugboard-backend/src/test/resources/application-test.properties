# Test profile: do not require external env vars for context loading.
# These values are for tests only and are never used in production.

# In-memory H2 datasource so the Spring context can load without Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-not-used-in-production-32b
