spring.application.name=BugBoard26
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bugboard_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bugboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

# JPA / Hibernate (development-friendly defaults)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool tuning (optional)
spring.datasource.hikari.maximum-pool-size=10
jwt.secret=${JWT_SECRET}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}