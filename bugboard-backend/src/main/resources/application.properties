spring.application.name=BugBoard26
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bugboard_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bugboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

# PostgreSQL SSL Configuration (prefer uses SSL on Azure, non-SSL on local Postgres)
spring.datasource.hikari.data-source-properties.sslmode=${POSTGRES_SSLMODE:prefer}
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# JPA / Hibernate (development-friendly defaults)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Connection pool tuning (optional)
spring.datasource.hikari.maximum-pool-size=10

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Azure Storage Configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}

# CORS Configuration (supports multiple origins separated by comma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logging Configuration for Debugging
logging.level.org.postgresql=DEBUG
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB