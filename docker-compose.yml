services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./db/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bugboard_db}
      - POSTGRES_USER=${POSTGRES_USER:-bugboard}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugboard} -d ${POSTGRES_DB:-bugboard_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./bugboard-backend
      dockerfile: Dockerfile
    image: bugboard-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-bugboard_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-bugboard}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    ports:
      - "8080:8080"

volumes:
  db_data:
