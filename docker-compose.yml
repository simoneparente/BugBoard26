services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bugboard_db}
      - POSTGRES_USER=${POSTGRES_USER:-bugboard}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugboard} -d ${POSTGRES_DB:-bugboard_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    hostname: azurite
    ports:
      - "10001:10000"
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"

  backend:
    build:
      context: ./bugboard-backend
      dockerfile: Dockerfile
    image: bugboard-backend:local
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-bugboard_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-bugboard}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:?AZURE_STORAGE_CONNECTION_STRING must be set}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME:?AZURE_STORAGE_CONTAINER_NAME must be set}
      - SEED_USERNAME=${SEED_USERNAME:-bugboard}
      - SEED_EMAIL=${SEED_EMAIL:-bugboard@bugboard.it}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLMODE=${SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_SSLMODE:-disable}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./bugboard-frontend
      dockerfile: Dockerfile
    image: bugboard-frontend:local
    environment:
      - API_TARGET=http://backend:8080
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4200"

volumes:
  db_data:
  uploads_data:
