name: Frontend CI (Lint & Format Check)

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop, 'feature/*' ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    
    # Define the base directory for all 'run' commands in this job
    defaults:
      run:
        working-directory: ./bugboard-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          # Explicitly tell the cache action where the lockfile is located
          cache-dependency-path: ./bugboard-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting with Prettier
        run: npm run format:check