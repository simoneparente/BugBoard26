name: Frontend CI (Lint & Format)

on:
  push:
    branches: [ main, development, 'feature/**' ] 
  pull_request:
    branches: [ main, development, 'feature/**' ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js environment matching project specifications
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-style: 'node'
          node-version: '22' # Aligned with modern framework standards
          cache: 'npm'       # Caches dependencies to optimize execution time

      # Step 3: Install dependencies using clean install mode
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Step 4: Run Prettier check. Pipeline fails if code is not properly formatted
      - name: Verify code formatting with Prettier
        run: npm run format:check